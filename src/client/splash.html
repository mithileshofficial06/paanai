<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Paanai</title>
    <link rel="preload" href="/fonts/bagel-fat-one-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="splash" data-phase="throw">
    <main class="card" aria-live="polite">
      <div class="stage" aria-hidden="true">
        <div class="glow"></div>
        <div class="flare"></div>
        <div class="embers" id="embers"></div>
        <svg class="wheel" viewBox="0 0 200 160" role="presentation">
          <defs>
            <radialGradient id="clayG" cx="34%" cy="30%" r="85%">
              <stop offset="0" stop-color="#c99a7c" />
              <stop offset="0.45" stop-color="#8a5b45" />
              <stop offset="1" stop-color="#3b2219" />
            </radialGradient>
            <radialGradient id="glazeG" cx="32%" cy="28%" r="90%">
              <stop offset="0" id="gz0" stop-color="#d7f0e0" />
              <stop offset="0.4" id="gz1" stop-color="#8fbfa4" />
              <stop offset="1" id="gz2" stop-color="#2f5a49" />
            </radialGradient>
            <radialGradient id="mouthG" cx="50%" cy="40%" r="60%">
              <stop offset="0" stop-color="#1a0d09" />
              <stop offset="1" stop-color="#3b2219" />
            </radialGradient>
            <linearGradient id="headG" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#c9c4c0" />
              <stop offset="0.5" stop-color="#6a6461" />
              <stop offset="1" stop-color="#232120" />
            </linearGradient>
            <linearGradient id="sheen" x1="0" x2="1">
              <stop offset="0" stop-color="#fff" stop-opacity="0" />
              <stop offset="0.5" stop-color="#fff" stop-opacity="0.38" />
              <stop offset="1" stop-color="#fff" stop-opacity="0" />
            </linearGradient>
            <radialGradient id="tipG">
              <stop offset="0" stop-color="#fff6e8" />
              <stop offset="0.35" stop-color="#ffb37a" stop-opacity="0.9" />
              <stop offset="1" stop-color="#ff5a36" stop-opacity="0" />
            </radialGradient>
            <clipPath id="potClip"><path id="clipPath" d="" /></clipPath>
          </defs>
          <ellipse cx="100" cy="142" rx="86" ry="11" fill="#000" opacity="0.6" />
          <ellipse cx="100" cy="134" rx="76" ry="11" fill="url(#headG)" />
          <ellipse cx="100" cy="132" rx="70" ry="8.5" fill="#2e2a28" />
          <ellipse class="spin spin--a" cx="100" cy="132" rx="58" ry="6.8" />
          <ellipse class="spin spin--b" cx="100" cy="132" rx="44" ry="5.2" />
          <path id="ghost" class="ghost" d="" />
          <path id="clay" d="" fill="url(#clayG)" />
          <path id="glaze" class="glaze" d="" fill="url(#glazeG)" />
          <g clip-path="url(#potClip)">
            <g id="rings" class="rings"></g>
            <rect class="sheen-bar" x="-60" y="0" width="30" height="160" fill="url(#sheen)" />
          </g>
          <ellipse id="mouth" cx="100" cy="60" rx="0" ry="0" fill="url(#mouthG)" />
          <circle id="tip" class="tip" cx="0" cy="0" r="9" fill="url(#tipG)" />
        </svg>
        <span class="match" id="match">Match <b id="matchNum">0</b>%</span>
        <span class="found" id="found"><i></i><span id="foundName">Celadon</span> · new in the Codex</span>
        <ol class="steps">
          <li data-s="throw">Throw</li>
          <li data-s="fire">Fire</li>
          <li data-s="reveal">Reveal</li>
        </ol>
      </div>

      <section class="info">
        <div class="pills">
          <span class="pill pill--live"><i></i><span id="live">Open today</span></span>
          <span class="pill" id="kiln">Kiln fires at 00:00 UTC</span>
        </div>
        <p class="eyebrow" id="eyebrow">Today's commission</p>
        <h1 class="title" id="title">Paanai</h1>
        <p class="meta" id="meta">A daily pottery game</p>
        <div class="row">
          <div class="target-wrap">
            <svg class="target" viewBox="0 0 100 100" aria-hidden="true"><path id="target" d="" /></svg>
          </div>
          <div class="beat">
            <span class="beat-label" id="beatLabel">Beat</span>
            <span class="beat-num" id="beat">--</span>
            <span class="beat-by" id="beatBy"></span>
          </div>
        </div>
        <p class="status" id="status"></p>
        <button class="throw" id="throw" type="button">
          <svg class="throw__icon" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16" rx="9" ry="3" /><path d="M8 15.5V9.5c0-2 1.6-3.5 4-3.5s4 1.5 4 3.5v6" /></svg>
          <span id="throwLabel">Throw today's pot</span>
        </button>
        <p class="sub" id="sub">Shape it today. Every pot fires together overnight.</p>
      </section>
    </main>
    <script type="module" src="splash.ts"></script>
  </body>
</html>
