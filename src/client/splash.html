<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Paanai</title>
    <link rel="preload" href="/fonts/fraunces-latin-var.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="splash">
    <main class="card" aria-live="polite">
      <div class="stage" aria-hidden="true">
        <div class="ember"></div>
        <svg class="wheel" viewBox="0 0 200 120" role="presentation">
          <defs>
            <radialGradient id="clayG" cx="36%" cy="32%" r="80%">
              <stop offset="0" stop-color="#b08a74" />
              <stop offset="0.45" stop-color="#76584a" />
              <stop offset="1" stop-color="#3a2a22" />
            </radialGradient>
            <linearGradient id="headG" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#b4b0ad" />
              <stop offset="0.5" stop-color="#5f5b59" />
              <stop offset="1" stop-color="#232120" />
            </linearGradient>
            <linearGradient id="sheen" x1="0" x2="1">
              <stop offset="0" stop-color="#fff" stop-opacity="0" />
              <stop offset="0.5" stop-color="#fff" stop-opacity="0.34" />
              <stop offset="1" stop-color="#fff" stop-opacity="0" />
            </linearGradient>
            <clipPath id="clayClip"><path id="clayClipPath" d="" /></clipPath>
          </defs>
          <ellipse cx="100" cy="106" rx="80" ry="10" fill="#000" opacity="0.6" />
          <ellipse cx="100" cy="99" rx="72" ry="10" fill="url(#headG)" />
          <ellipse cx="100" cy="97" rx="67" ry="7.5" fill="#34302e" />
          <path id="clayBody" d="" fill="url(#clayG)" />
          <g clip-path="url(#clayClip)">
            <g id="rings" stroke="#000" stroke-opacity="0.13" stroke-width="0.5" fill="none"></g>
            <rect class="sheen-bar" x="-60" y="0" width="34" height="120" fill="url(#sheen)" />
          </g>
        </svg>
      </div>

      <section class="info">
        <p class="eyebrow" id="eyebrow">Today's commission</p>
        <h1 class="title" id="title">Paanai</h1>
        <p class="meta" id="meta">A daily pottery game</p>
        <div class="row">
          <div class="target-wrap">
            <svg class="target" viewBox="0 0 100 100" aria-hidden="true"><path id="target" d="" /></svg>
            <span class="target-label">Target</span>
          </div>
          <div class="beat">
            <span class="beat-label" id="beatLabel">Beat</span>
            <span class="beat-num" id="beat">--</span>
            <span class="beat-by" id="beatBy"></span>
          </div>
        </div>
        <p class="status" id="status"></p>
        <button class="throw" id="throw" type="button"><span id="throwLabel">Throw</span></button>
        <p class="sub" id="sub">Shape it today. The next kiln fires it. Open it tomorrow.</p>
      </section>
    </main>
    <script type="module" src="splash.ts"></script>
  </body>
</html>
