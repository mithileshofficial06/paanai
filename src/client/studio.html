      #boot { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; align-content: center; gap: 6px; color: #f3e3d6;
        background: radial-gradient(80% 60% at 50% 105%, rgba(150, 20, 16, 0.55), transparent 70%), radial-gradient(60% 50% at 80% 0%, rgba(90, 14, 12, 0.35), transparent 70%), #0b0606;

      #boot.is-done { opacity: 0; visibility: hidden; }
      .bl__brand { margin: 0; font: 400 clamp(2.6rem, 9vw, 3.6rem)/1 'Shrikhand', Georgia, serif; letter-spacing: 0.01em;
        background: linear-gradient(100deg, #ffd27a, #ff7a2c 50%, #ff3a3a); -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 0 22px rgba(255, 90, 40, 0.45)); }
      .bl__tag { margin: 0 0 6px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #ff9a7a; }
      .bl__art { width: min(78vw, 340px); height: auto; overflow: visible; }
      .bl__meter { width: min(70vw, 280px); height: 6px; margin-top: 10px; border-radius: 99px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
      .bl__fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #c8861c, #ffd56a); box-shadow: 0 0 12px rgba(255, 190, 70, 0.7); }
      .bl__step { margin: 4px 0 0; min-height: 1.4em; font-size: 0.95rem; color: #d9c3b4; }
      .bl__pct { font-variant-numeric: tabular-nums; color: #ffd27a; font-weight: 700; margin-left: 6px; }
      @media (prefers-reduced-motion: reduce) { #boot { transition: none; } }
    </style>

    <script>
      (function () {
        var root = document.getElementById('boot');
        var fill = root.querySelector('.bl__fill');
        var step = root.querySelector('.bl__label');
        var pct = root.querySelector('.bl__pct');
        var STEPS = [[0, 'Wedging the clay'], [30, 'Centring on the wheel'], [62, 'Opening the studio'], [86, 'Lighting the kiln'], [100, 'Ready']];
        var p = 0, target = 8, finished = false;
        // While the game script downloads, creep towards 55%; the app moves it on as it boots.
        var creep = setInterval(function () { if (target < 55) target += 1.5; }, 120);
        function frame() {
          p += (target - p) * 0.08;
          if (target - p < 0.2) p = target;
          fill.style.width = p.toFixed(1) + '%';
          pct.textContent = Math.round(p) + '%';
          var label = STEPS[0][1];
          for (var i = 0; i < STEPS.length; i++) if (p >= STEPS[i][0]) label = STEPS[i][1];
          if (step.textContent !== label) step.textContent = label;
          if (finished && p >= 99.5) {
            root.classList.add('is-done');
            setTimeout(function () { root.remove(); }, 700);
            return;
          }
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
        window.__boot = {
          to: function (t) { target = Math.max(target, t); },
          done: function () { clearInterval(creep); finished = true; target = 100; }
        };
      })();
    </script>
