<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Paanai</title>
    <link rel="preload" href="/fonts/bagel-fat-one-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/outfit-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'Bagel Fat One'; src: url('/fonts/bagel-fat-one-latin.woff2') format('woff2'); font-display: block; }
      @font-face { font-family: 'Outfit'; src: url('/fonts/outfit-latin-var.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
      html, body { margin: 0; background: #070303; }
      body.is-booting #app { opacity: 0; }
      #app { transition: opacity 0.45s ease; }
      #boot { position: fixed; inset: 0; z-index: 1000; overflow: hidden; color: #f3e3d6; background: #070303;
        font-family: 'Outfit', system-ui, sans-serif; transition: opacity 0.35s ease, visibility 0.35s; }
      #boot.is-done { opacity: 0; visibility: hidden; }
      .bl__canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .bl__top { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 9vh); display: grid; justify-items: center; gap: 4px; text-align: center; pointer-events: none; }
      .bl__tag { margin: 0; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: #ff9a7a; opacity: 0; animation: bl-in 0.9s 0.15s ease forwards; }
      .bl__brand { margin: 0; font: 400 clamp(3rem, 13vw, 4.4rem)/1 'Bagel Fat One', system-ui, sans-serif; letter-spacing: 0.02em;
        background: linear-gradient(100deg, #ffe2a0 0%, #ffb04a 30%, #ff6a2c 60%, #ff3a3a 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 0 26px rgba(255, 90, 40, 0.42)); animation: bl-brand 1s ease both, bl-sheen 4.5s 1s ease-in-out infinite; }
      .bl__bottom { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 9vh); display: grid; justify-items: center; gap: 10px; pointer-events: none; }
      .bl__meter { position: relative; width: min(70vw, 280px); height: 6px; border-radius: 99px; background: rgba(255, 255, 255, 0.07); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6); }
      .bl__fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #a8401c, #ff8a3c 60%, #ffd56a); box-shadow: 0 0 14px rgba(255, 170, 70, 0.75); }
      .bl__step { margin: 0; min-height: 1.4em; font-size: 1rem; font-weight: 500; color: #e6cfbf; letter-spacing: 0.01em; }
      .bl__label { display: inline-block; animation: bl-in 0.4s ease both; }
      .bl__pct { font-variant-numeric: tabular-nums; color: #ffd27a; font-weight: 700; margin-left: 8px; }
      @keyframes bl-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes bl-brand { from { opacity: 0; transform: translateY(10px) scale(0.96); letter-spacing: 0.12em; } to { opacity: 1; transform: none; } }
      @keyframes bl-sheen { 0%, 100% { background-position: 0% 0; } 50% { background-position: 100% 0; } }
      @media (prefers-reduced-motion: reduce) { #boot, #app { transition: none; } .bl__brand, .bl__tag, .bl__label { animation: none; opacity: 1; } }
    </style>
  </head>
  <body class="studio is-booting">
    <div id="boot" role="status" aria-live="polite" aria-label="Loading Paanai">
      <canvas class="bl__canvas" aria-hidden="true"></canvas>
      <div class="bl__top">
        <p class="bl__tag">A daily pottery studio</p>
        <h1 class="bl__brand">Paanai</h1>
      </div>
      <div class="bl__bottom">
        <div class="bl__meter"><div class="bl__fill"></div></div>
        <p class="bl__step"><span class="bl__label">Wedging the clay</span><span class="bl__pct">0%</span></p>
      </div>
    </div>
    <script src="/boot.js"></script>
    <div id="app"></div>
    <script type="module" src="studio/main.tsx"></script>
  </body>
</html>
